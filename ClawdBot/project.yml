name: ClawdBot
options:
  bundleIdPrefix: com.clawdbot
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: ClawdBot/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_PREVIEWS: "YES"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  ClawdBot:
    type: application
    platform: iOS
    sources:
      - path: ClawdBot
        excludes:
          - "**/*.plist"
    resources:
      - path: ClawdBot/Resources
        optional: true
      - path: ClawdBot/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clawdbot.app
        PRODUCT_NAME: ClawdBot
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: ClawdBot/Info.plist
    info:
      path: ClawdBot/Info.plist
    entitlements:
      path: ClawdBot/ClawdBot.entitlements
      properties: {}
